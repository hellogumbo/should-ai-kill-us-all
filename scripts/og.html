<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1e1e1e;
    background:
      radial-gradient(ellipse 34% 55% at 6% 30%, #ff4fd8 0%, rgba(255,79,216,0.55) 40%, rgba(255,79,216,0) 70%),
      radial-gradient(ellipse 40% 60% at 96% 28%, #ff4fd8 0%, rgba(255,79,216,0.5) 45%, rgba(255,79,216,0) 72%),
      radial-gradient(ellipse 60% 40% at 20% 100%, #f386a1 0%, rgba(243,134,161,0) 70%),
      radial-gradient(ellipse 60% 40% at 80% 100%, #f386a1 0%, rgba(243,134,161,0) 70%),
      linear-gradient(180deg, #d9f1ff 0%, #eaf6ff 60%, #fefefe 100%);
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(30,30,30,0.22) 0.9px, transparent 1.1px);
    background-size: 4px 4px; mix-blend-mode: multiply; opacity: 0.38;
  }
  .win { position: absolute; left: 80px; top: 72px; width: 1040px; background: #fefefe; border: 2px solid #1e1e1e; box-shadow: 10px 10px 0 #1e1e1e; }
  .bar { display: flex; justify-content: space-between; background: #1e1e1e; color: #fefefe; font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; padding: 12px 20px; }
  .bar span:last-child { color: #c4c4c4; text-transform: none; letter-spacing: 0; }
  .body { padding: 44px 48px 48px; }
  h1 { margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 132px; letter-spacing: -0.05em; line-height: 0.9; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 36px; }
  .sub { font-size: 30px; line-height: 1.3; max-width: 640px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 18px; background: #f386a1; border: 2px solid #1e1e1e; padding: 12px 16px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar"><span>should-ai-kill-us-all.pages.dev</span><span>live verdict · jev-latest</span></div>
    <div class="body">
      <h1>Should AI<br>Kill Us All?</h1>
      <div class="row">
        <p class="sub">We ask Jev. Every ten minutes. Using the actual headlines.</p>
        <span class="tag">POST /v1/systemone</span>
      </div>
    </div>
  </div>
</body>
</html>
